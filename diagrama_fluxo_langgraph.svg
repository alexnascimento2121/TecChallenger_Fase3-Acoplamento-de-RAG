<svg viewBox="0 0 1000 1400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fluxo do assistente médico orquestrado pelo LangGraph: do recebimento da pergunta à geração da sugestão com guardrails, auditoria e validação humana obrigatória">
  <title>Fluxo do assistente médico — LangGraph (StateGraph)</title>
  <desc>
    Pipeline sequencial de 8 nós executado pelo StateGraph do LangGraph: recebe a solicitação,
    consulta prontuário, exames e protocolos via tools LangChain em um SQLite sintético, monta o
    contexto do paciente, gera uma sugestão com a LLM fine-tuned, aplica guardrails de segurança
    (disclaimer obrigatório, detecção de linguagem de prescrição) e emite alertas, sempre exigindo
    validação humana e registrando tudo em log e auditoria.
  </desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="1400" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">
    Assistente médico — fluxo LangGraph (StateGraph)
  </text>
  <text x="500" y="56" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">
    8 nós sequenciais · estado compartilhado AssistenteState · guardrails + auditoria em todo o percurso
  </text>

  <!-- START -->
  <rect x="420" y="72" width="160" height="42" rx="21" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="500" y="98" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">START</text>

  <!-- arrow START -> 1 -->
  <line x1="500" y1="114" x2="500" y2="163" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 1: receber_solicitacao -->
  <rect x="300" y="163" width="400" height="66" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="500" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">receber_solicitacao</text>
  <text x="500" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">gera request_id · inicia alertas/logs_fluxo</text>

  <!-- arrow 1 -> 2 -->
  <line x1="500" y1="229" x2="500" y2="286" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="515" y="261" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">paciente_id</text>

  <!-- Node 2: consultar_prontuario -->
  <rect x="300" y="286" width="400" height="66" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500" y="313" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">consultar_prontuario</text>
  <text x="500" y="333" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1e3a8a">tool consultar_paciente → EHR (SQLite)</text>

  <!-- arrow 2 -> 3 -->
  <line x1="500" y1="352" x2="500" y2="409" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="515" y="384" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">prontuário</text>

  <!-- Node 3: verificar_exames -->
  <rect x="300" y="409" width="400" height="66" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500" y="436" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">verificar_exames</text>
  <text x="500" y="456" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1e3a8a">tool listar_exames → define exames_urgentes_pendentes</text>

  <!-- arrow 3 -> 4 -->
  <line x1="500" y1="475" x2="500" y2="532" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="515" y="507" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">pergunta + diagnósticos</text>

  <!-- Node 4: buscar_protocolos -->
  <rect x="300" y="532" width="400" height="66" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500" y="559" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">buscar_protocolos</text>
  <text x="500" y="579" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1e3a8a">tool buscar_protocolo → protocolos internos</text>

  <!-- arrow 4 -> 5 -->
  <line x1="500" y1="598" x2="500" y2="655" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="515" y="630" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">protocolos</text>

  <!-- Node 5: montar_contexto -->
  <rect x="300" y="655" width="400" height="66" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="500" y="682" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">montar_contexto</text>
  <text x="500" y="702" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">junta prontuário + exames + protocolos · extrai fontes</text>

  <!-- arrow 5 -> 6 -->
  <line x1="500" y1="721" x2="500" y2="778" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="515" y="753" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">contexto + fontes</text>

  <!-- Node 6: gerar_sugestao (LLM) -->
  <rect x="300" y="778" width="400" height="66" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="500" y="805" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#4c1d95">gerar_sugestao</text>
  <text x="500" y="825" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4c1d95">LLM fine-tuned (LoRA) + contexto do paciente</text>

  <!-- arrow 6 -> 7 -->
  <line x1="500" y1="844" x2="500" y2="901" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="515" y="876" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">resposta_bruta</text>

  <!-- Node 7: validar_seguranca (guardrails) -->
  <rect x="300" y="901" width="400" height="66" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="500" y="928" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#7c2d12">validar_seguranca</text>
  <text x="500" y="948" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#7c2d12">guardrails: disclaimer obrigatório + detecção de padrões de risco</text>

  <!-- arrow 7 -> 8 -->
  <line x1="500" y1="967" x2="500" y2="1024" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="515" y="999" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">resposta_final + precisa_revisao_humana=True</text>

  <!-- Node 8: emitir_alerta -->
  <rect x="300" y="1024" width="400" height="66" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="500" y="1051" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#7f1d1d">emitir_alerta</text>
  <text x="500" y="1071" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#7f1d1d">alerta à equipe + fila de validação humana</text>

  <!-- arrow 8 -> END -->
  <line x1="500" y1="1090" x2="500" y2="1147" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="515" y="1122" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">alertas + fontes + logs_fluxo</text>

  <!-- END -->
  <rect x="420" y="1147" width="160" height="42" rx="21" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="500" y="1173" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">END</text>

  <!-- Callout: auditoria_respostas.jsonl ao lado do nó 8 -->
  <line x1="700" y1="1057" x2="758" y2="1057" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="715" y="1048" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#7f1d1d">grava evento</text>
  <rect x="758" y="1027" width="210" height="60" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="863" y="1052" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#7f1d1d">auditoria_respostas.jsonl</text>
  <text x="863" y="1070" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#7f1d1d">1 evento JSON por interação</text>

  <!-- Bracket direito: tools LangChain (nós 2-4) -->
  <line x1="770" y1="286" x2="770" y2="598" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="770" y1="286" x2="755" y2="286" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="770" y1="598" x2="755" y2="598" stroke="#2563eb" stroke-width="1.5"/>
  <text x="790" y="432" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">Tools LangChain →</text>
  <text x="790" y="450" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1e3a8a">SQLite hospital_</text>
  <text x="790" y="466" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1e3a8a">prontuarios.db</text>

  <!-- Bracket esquerdo: logging (nós 1-8) -->
  <line x1="230" y1="163" x2="230" y2="1090" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="230" y1="163" x2="245" y2="163" stroke="#64748b" stroke-width="1.5"/>
  <line x1="230" y1="1090" x2="245" y2="1090" stroke="#64748b" stroke-width="1.5"/>
  <text x="212" y="620" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">assistente_medico.log</text>
  <text x="212" y="638" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">(cada nó grava sua</text>
  <text x="212" y="654" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">execução — auditoria técnica)</text>

  <!-- Legenda -->
  <text x="300" y="1225" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Legenda</text>

  <rect x="300" y="1240" width="18" height="18" rx="3" fill="#f1f5f9" stroke="#64748b"/>
  <text x="326" y="1253" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1e293b">Controle de fluxo</text>

  <rect x="300" y="1266" width="18" height="18" rx="3" fill="#dbeafe" stroke="#2563eb"/>
  <text x="326" y="1279" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1e293b">Consulta a dados estruturados (SQLite via tools LangChain)</text>

  <rect x="300" y="1292" width="18" height="18" rx="3" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="326" y="1305" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1e293b">Geração de resposta via LLM fine-tuned (LoRA)</text>

  <rect x="300" y="1318" width="18" height="18" rx="3" fill="#ffedd5" stroke="#ea580c"/>
  <text x="326" y="1331" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1e293b">Guardrails de segurança / explainability</text>

  <rect x="300" y="1344" width="18" height="18" rx="3" fill="#fee2e2" stroke="#dc2626"/>
  <text x="326" y="1357" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1e293b">Alertas, auditoria e validação humana obrigatória</text>
</svg>
