<text x="500.0" y="426.72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">receber_solicitacao</text>
<text x="500.0" y="446.52" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#0f172a">gera request_id · inicia alertas/logs_fluxo</text>
