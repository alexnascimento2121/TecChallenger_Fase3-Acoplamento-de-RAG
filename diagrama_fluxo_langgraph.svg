<text x="500.0" y="559.52" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1e3a8a">tool consultar_paciente → EHR (SQLite)</text>
<line x1="500" y1="578" x2="500" y2="623" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
