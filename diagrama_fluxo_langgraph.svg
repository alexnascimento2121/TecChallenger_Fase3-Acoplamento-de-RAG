<svg viewBox="0 0 1000 1943" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fluxo completo do assistente médico: a camada de validação da Etapa 3 valida a entrada, executa o StateGraph da Fase 2 e valida e filtra a saída antes de responder, sempre exigindo revisão humana e registrando auditoria">
  <title>Fluxo do assistente médico — Etapa 3 (validação) + Fase 2 (LangGraph)</title>
  <desc>
    consultar_com_validacao recebe paciente e pergunta, bloqueia entradas inválidas ou de risco
    (verificar_entrada_etapa3), executa o StateGraph de 8 nós da Fase 2 (consulta prontuário,
    exames e protocolos via tools LangChain em um SQLite sintético, monta contexto, gera sugestão
    com a LLM fine-tuned, aplica guardrails e emite alertas), e em seguida valida o retorno
    (verificar_retorno_etapa3) e confere quais itens citados existem de fato no cadastro
    (conferir_itens_etapa3) antes de montar a resposta final numerada ou reter a consulta
    (encerrar_etapa3), sempre exigindo revisão humana e registrando tudo em auditoria_etapa3.jsonl.
  </desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="1943" fill="#ffffff"/>

<text x="500" y="32" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Assistente médico — fluxo completo: validação (Etapa 3) envolvendo o LangGraph (Fase 2)</text>
<text x="500" y="54" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b">consultar_com_validacao() valida a entrada, executa o StateGraph e valida/filtra a saída antes de responder</text>
<rect x="420" y="76" width="160" height="42" rx="21" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="500" y="103" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Pergunta do médico + paciente_id</text>
<line x1="500" y1="118" x2="500" y2="163" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="515" y="142" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">consultar_com_validacao(paciente, pergunta)</text>
<rect x="300.0" y="165" width="400" height="70" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="500.0" y="194.4" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#78350f">verificar_entrada_etapa3</text>
<text x="500.0" y="215.4" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350f">bloqueia paciente inválido, pergunta vazia ou termo de risco</text>
<line x1="700.0" y1="200" x2="760.0" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="730.0" y="192" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#78350f">motivo de entrada</text>
<rect x="760.0" y="160" width="220" height="80" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="870.0" y="185" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#7f1d1d">Retida</text>
<text x="870.0" y="203" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#7f1d1d">identificador_invalido,</text>
<text x="870.0" y="219" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#7f1d1d">pergunta_vazia ou</text>
<text x="870.0" y="235" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#7f1d1d">entrada_prescricao_ou_conduta</text>
<line x1="500" y1="235" x2="500" y2="278" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="515" y="259" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">ok → segue para o grafo</text>
<rect x="220.0" y="280" width="540.0" height="1078" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5"/>
<text x="310.0" y="302" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">FASE 2 — LangGraph (StateGraph, 8 nós)</text>
